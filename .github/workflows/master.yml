# ============================================================
# GitHub Actions CI/CD Workflow — RaceDay Part 1
# Runs automatically on every push to the master branch.
# Checks that all required planning documents are present.
# ============================================================

name: Validate Part 1 Submission Structure

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  check-docs-folder:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository code onto the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Confirm the /docs folder exists
      - name: Check docs folder exists
        run: |
          echo "Checking /docs folder..."
          if [ -d "docs" ]; then
            echo "docs folder found"
          else
            echo "ERROR: docs folder is missing"
            exit 1
          fi

      # Step 3: Confirm an ERD file (PNG or PDF) is inside /docs
      - name: Check ERD file exists
        run: |
          echo "Checking for ERD file..."
          ERD_COUNT=$(find docs -maxdepth 1 \( -name "*.png" -o -name "*.pdf" \) | wc -l)
          if [ "$ERD_COUNT" -gt 0 ]; then
            echo "ERD file found"
            find docs -maxdepth 1 \( -name "*.png" -o -name "*.pdf" \)
          else
            echo "ERROR: No ERD PNG or PDF found in /docs"
            exit 1
          fi

      # Step 4: Confirm the API endpoint plan file is inside /docs
      - name: Check API endpoint plan exists
        run: |
          echo "Checking for API endpoint plan..."
          if [ -f "docs/api_endpoint_plan.md" ]; then
            echo "api_endpoint_plan.md found"
          else
            echo "ERROR: api_endpoint_plan.md not found in /docs"
            exit 1
          fi

      # Step 5: Confirm the SQL script is inside /docs
      - name: Check SQL script exists
        run: |
          echo "Checking for SQL script..."
          SQL_COUNT=$(find docs -maxdepth 1 -name "*.sql" | wc -l)
          if [ "$SQL_COUNT" -gt 0 ]; then
            echo "SQL script found"
            find docs -maxdepth 1 -name "*.sql"
          else
            echo "ERROR: No .sql file found in /docs"
            exit 1
          fi

      # Step 6: Confirm the README exists at the root
      - name: Check README exists
        run: |
          echo "Checking for README.md..."
          if [ -f "README.md" ]; then
            echo "README.md found"
          else
            echo "ERROR: README.md missing from root"
            exit 1
          fi

      # Step 7: Print all files in /docs for the log
      - name: List docs folder contents
        run: |
          echo "Contents of /docs folder:"
          ls -la docs/
          echo "All checks passed - submission structure is valid"
